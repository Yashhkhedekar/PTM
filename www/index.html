async function auth(ev){ev.preventDefault();const f=new FormData(ev.target),em=f.get('e').trim(),pw=f.get('p');const r=mode=='up'?await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:RD()}}):await SB.auth.signInWithPassword({email:em,password:pw});if(r.error)return loginUI(r.error.message);if(!r.data.session)return loginUI('Check your email and confirm your account, then sign in.',1);enter(r.data.session.user)}
async function forgot(){const em=((document.querySelector('#lg [name=e]')||{}).value||'').trim();if(!em)return loginUI('Type your email first, then tap Forgot password.');const r=await SB.auth.resetPasswordForEmail(em,{redirectTo:RD()});loginUI(r.error?r.error.message:'Password reset link sent. Check your email.',!r.error)}
const newPw=()=>ask('Set a new password',[{l:'New password (8+ characters)',k:'p',t:'password'}],async o=>{const r=await SB.auth.updateUser({password:o.p});toast(r.error?r.error.message:'Password updated')});
const signOut=async()=>{await SB.auth.signOut();location.reload()};
const delAcc=()=>ask('Delete your account and all data permanently? This cannot be undone.',[{l:'Type DELETE',k:'c'}],async o=>{if(o.c!='DELETE')return;ready=false;const r=await SB.rpc('delete_my_account');if(r.error){ready=true;toast(r.error.message);return}try{localStorage.removeItem(LK)}catch(e){}await SB.auth.signOut();location.reload()});
function connectUI(m){let e=document.getElementById('lg');if(!e){e=document.createElement('div');e.id='lg';document.body.append(e)}
e.innerHTML=`<form class="lgc" onsubmit="saveCfg(event)">${LOGO(56)}<h1>One-time setup</h1><p class="s">Paste the details from your Supabase project (Project Settings, API). You only do this once on this phone.</p><input name="u" placeholder="Project URL (https://...supabase.co)" required><input name="k" placeholder="Anon or publishable key" required><input name="w" placeholder="Your website link (optional, for password reset)"><p class="msg">${esc(m||'')}</p><button class="p">Save and continue</button></form>`}
function saveCfg(ev){ev.preventDefault();const f=new FormData(ev.target),u=f.get('u').trim(),k=f.get('k').trim(),w=f.get('w').trim();if(!u.startsWith('https://'))return connectUI('The project URL must start with https://');try{localStorage.setItem('ptm-cfg',JSON.stringify({url:u,key:k,site:w||''}))}catch(e){}location.reload()}
async function enter(u){UID=u.id;LK='phq:'+UID;let d=null;try{const r=await SB.from('app_state').select('data').eq('user_id',UID).maybeSingle();if(r.error)throw r.error;d=r.data&&r.data.data}catch(e){return fail('Check your internet connection.')}
const l=document.getElementById('lg');l&&l.remove();const nw=!d||!Object.keys(d).length;S=fixS(nw?EMPTY():d);ready=true;render();if(nw)save()}
(async()=>{applyTheme();
if(!SB&&CF0)return connectUI();
if(SB){SB.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')newPw()});const g=await SB.auth.getSession();return g.data.session?enter(g.data.session.user):loginUI()}
const w=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);let bad=false,remote=false;
try{if(window.claude){const u=await w(claude.use('user'),4000),id=u&&await u.id();db=await w(claude.use('db'),4000);if(db&&id){dref=db.collection('data/users/'+id).doc('state');const x=await w(dref.get(),5000);if(!x)bad=true;else if(x.exists){S=JSON.parse(x.data().json);remote=true}}}}catch(e){bad=true}
if(bad){dref=null;return fail('Your saved data did not load in time.')}
if(!S)try{S=JSON.parse(localStorage.getItem('phq'))}catch(e){}
S=fixS(S||EMPTY());ready=true;render();if(!remote)save()})();
</script></body></html>
